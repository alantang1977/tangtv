name: 自动同步上游并应用自定义
# ============================================
# 全自动同步工作流 v3
# 功能：
#   1. 定时检查上游仓库更新（每2小时）
#   2. 同步上游 main 分支和所有其他分支
#   3. 自动修改 app 名称 / 包名（custom/apply_custom.py）
#   4. 自动生成全套图标（custom/gen_app_icon.py）
#   5. 推送 custom 分支到当前仓库
#   6. 可选：自动构建 Debug APK
#   7. 可选：推送 custom 分支到 tangtv 仓库
# 触发方式：
#   - 定时：每2小时自动运行
#   - 手动：Actions 页面点 "Run workflow"，可勾选选项
# ============================================

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重新生成 custom 分支（即使上游无更新）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      build_apk:
        description: '是否构建 Debug APK'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      push_to_tangtv:
        description: '是否推送到 tangtv 仓库（需配置 TANGTV_PAT）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  sync-and-customize:
    runs-on: ubuntu-latest

    steps:
      # ====== 第 1 步：检出代码 ======
      - name: 检出 main 分支代码
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ====== 第 2 步：配置 Git ======
      - name: 配置 Git 用户信息
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase false

      # ====== 第 3 步：备份自定义文件 ======
      - name: 备份自定义脚本和配置
        run: |
          mkdir -p /tmp/automation-backup
          if [ -d "custom" ]; then
            cp -r custom /tmp/automation-backup/
            echo "[backup] custom/ 已备份"
          fi
          if [ -d ".github/workflows" ]; then
            mkdir -p /tmp/automation-backup/.github
            cp -r .github/workflows /tmp/automation-backup/.github/
            echo "[backup] .github/workflows/ 已备份"
          fi
          echo "=== 备份内容 ==="
          find /tmp/automation-backup -type f | sort

      # ====== 第 4 步：添加上游并获取最新 ======
      - name: 添加上游仓库并获取最新
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Silent1566/webhtv.git
          git fetch upstream --prune
          echo "=== 上游分支列表 ==="
          git branch -r | grep upstream/
          echo "=== 上游 main 最新 commit ==="
          git log upstream/main -1 --oneline

      # ====== 第 5 步：检查是否有更新 ======
      - name: 检查上游是否有更新
        id: check_update
        run: |
          LOCAL_MAIN=$(git rev-parse main)
          UPSTREAM_MAIN=$(git rev-parse upstream/main)
          echo "本地 main:  $LOCAL_MAIN"
          echo "上游 main:  $UPSTREAM_MAIN"
          if [ "$LOCAL_MAIN" = "$UPSTREAM_MAIN" ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "[info] 上游 main 无更新"
          else
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "[info] 上游 main 有更新，开始同步"
            echo "=== 更新内容 ==="
            git log --oneline ${LOCAL_MAIN}..${UPSTREAM_MAIN} | head -20
          fi

      # ====== 第 6 步：同步 main 分支 ======
      - name: 同步 main 分支到上游最新
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          git checkout main
          git reset --hard upstream/main
          echo "[ok] main 已重置到上游最新"

      # ====== 第 7 步：恢复自定义文件并提交 ======
      # 注意：main 分支包含 .github/workflows/auto-sync.yml，必须用 TANGTV_PAT 推送
      - name: 恢复自定义文件并提交
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          if [ -d "/tmp/automation-backup/custom" ]; then
            rm -rf custom
            cp -r /tmp/automation-backup/custom .
            echo "[restore] custom/ 已恢复"
          fi
          if [ -d "/tmp/automation-backup/.github/workflows" ]; then
            mkdir -p .github
            rm -rf .github/workflows
            cp -r /tmp/automation-backup/.github/workflows .github/
            echo "[restore] .github/workflows/ 已恢复"
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "[info] 自定义文件无变化，无需提交"
          else
            git commit -m "bot: 恢复自定义脚本和配置"
            echo "[ok] 自定义文件已提交到 main"
          fi

          # 检查 TANGTV_PAT
          if [ -z "${{ secrets.TANGTV_PAT }}" ]; then
            echo "[error] 未配置 TANGTV_PAT，无法推送包含工作流文件的分支"
            exit 1
          fi

          # 清除默认认证头，使用 TANGTV_PAT 推送
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          PUSH_URL="https://x-access-token:${{ secrets.TANGTV_PAT }}@github.com/${{ github.repository }}.git"
          git push "$PUSH_URL" main --force
          echo "[ok] main 已推送到远程 (使用 TANGTV_PAT)"

      # ====== 第 8 步：同步上游所有其他分支 ======
      - name: 同步上游所有其他分支
        if: steps.check_update.outputs.has_update == 'true'
        run: |
          echo "=== 开始同步上游其他分支 ==="
          PUSH_URL="https://x-access-token:${{ secrets.TANGTV_PAT }}@github.com/${{ github.repository }}.git"
          for upstream_branch in $(git branch -r | grep 'upstream/' | grep -v 'HEAD' | grep -v 'main'); do
            branch_name=${upstream_branch#upstream/}
            echo "同步分支: $branch_name"
            git push "$PUSH_URL" ${upstream_branch}:refs/heads/${branch_name} --force 2>&1 || echo "[warn] 分支 $branch_name 同步失败，跳过"
          done
          echo "=== 所有分支同步完成 ==="

      # ====== 第 9 步：安装 Python 依赖 ======
      - name: 安装 Python 依赖（Pillow）
        if: steps.check_update.outputs.has_update == 'true' || github.event.inputs.force_rebuild == 'true'
        run: |
          python3 -m pip install --upgrade pip
          pip install Pillow
          echo "[ok] Pillow 已安装"
          python3 -c "from PIL import Image; print('Pillow 版本:', Image.__version__)"

      # ====== 第 10 步：创建 custom 分支 ======
      - name: 创建 custom 分支（基于最新 main）
        if: steps.check_update.outputs.has_update == 'true' || github.event.inputs.force_rebuild == 'true'
        run: |
          git checkout main
          git branch -D custom 2>/dev/null || true
          git checkout -b custom
          echo "[ok] custom 分支已创建（基于最新 main）"

      # ====== 第 11 步：应用自定义修改 ======
      - name: 自动应用自定义修改（app名称/包名）
        if: steps.check_update.outputs.has_update == 'true' || github.event.inputs.force_rebuild == 'true'
        run: |
          echo "=== 应用自定义修改 ==="
          echo "配置文件内容:"
          cat custom/config.env
          echo ""
          python3 custom/apply_custom.py
          echo ""
          echo "=== 修改后的文件状态 ==="
          git status --short

      # ====== 第 12 步：生成图标 ======
      - name: 自动运行图标生成脚本
        if: steps.check_update.outputs.has_update == 'true' || github.event.inputs.force_rebuild == 'true'
        run: |
          echo "=== 生成应用图标 ==="
          ICON_STYLE=$(grep '^ICON_STYLE=' custom/config.env | cut -d'"' -f2)
          if [ -z "$ICON_STYLE" ]; then
            ICON_STYLE="3d"
          fi
          echo "图标风格: $ICON_STYLE"
          echo ""
          python3 custom/gen_app_icon.py --style "$ICON_STYLE"
          echo ""
          echo "=== 图标生成后的文件状态 ==="
          git status --short | head -40

      # ====== 第 13 步：提交并推送 custom 分支 ======
      # 注意：custom 分支包含修改后的 .github/workflows/*.yml 文件，
      # GITHUB_TOKEN 没有权限修改工作流文件，必须使用 TANGTV_PAT 推送
      - name: 提交并推送 custom 分支
        if: steps.check_update.outputs.has_update == 'true' || github.event.inputs.force_rebuild == 'true'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "[info] 没有变化需要提交"
          else
            UPSTREAM_COMMIT=$(git log upstream/main -1 --format="%h %s")
            COMMIT_MSG="auto: 同步上游并应用自定义修改 | 上游: ${UPSTREAM_COMMIT}"
            git commit -m "$COMMIT_MSG"
            echo "[ok] 已提交自定义修改"
          fi

          # 检查 TANGTV_PAT 是否配置
          if [ -z "${{ secrets.TANGTV_PAT }}" ]; then
            echo "[error] 未配置 TANGTV_PAT 密钥"
            echo "[error] custom 分支包含修改后的工作流文件，GITHUB_TOKEN 无权推送"
            echo "[error] 请在仓库 Settings -> Secrets and variables -> Actions 中添加 TANGTV_PAT（需勾选 repo 和 workflow 权限）"
            exit 1
          fi

          # 清除 GitHub Actions 自动注入的默认认证头（防止 GITHUB_TOKEN 覆盖我们的 PAT）
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          echo "[ok] 已清除默认认证头，使用 TANGTV_PAT 推送"

          # 使用 TANGTV_PAT 推送 custom 分支到当前仓库（带 workflow 权限）
          git push "https://x-access-token:${{ secrets.TANGTV_PAT }}@github.com/${{ github.repository }}.git" custom:refs/heads/custom --force
          echo "[ok] custom 分支已推送到远程 (使用 TANGTV_PAT)"

      # ====== 第 14 步：推送到 tangtv 仓库（可选）======
      - name: 推送到 tangtv 仓库
        if: (steps.check_update.outputs.has_update == 'true' || github.event.inputs.force_rebuild == 'true') && github.event.inputs.push_to_tangtv == 'true'
        run: |
          echo "=== 推送到 tangtv 仓库 ==="
          if [ -z "${{ secrets.TANGTV_PAT }}" ]; then
            echo "[error] 未配置 TANGTV_PAT 密钥，请在仓库 Settings -> Secrets and variables -> Actions 中添加 TANGTV_PAT"
            exit 1
          fi

          # 关键：清除 GitHub Actions 自动注入的默认认证头
          # GitHub Actions 会自动注入 GITHUB_TOKEN（身份是 github-actions[bot]），
          # 这个 bot 只有当前仓库权限，会覆盖我们自带的 TANGTV_PAT，导致 403
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          echo "[ok] 已清除默认认证头，将使用 TANGTV_PAT 认证"

          git remote remove tangtv 2>/dev/null || true
          git remote add tangtv https://x-access-token:${{ secrets.TANGTV_PAT }}@github.com/alantang1977/tangtv.git
          git fetch tangtv

          # 方式一（推荐）：只强制覆盖 main 分支，把 custom 分支的内容推送到 tangtv 的 main
          # --force 会强制覆盖 tangtv 仓库 main 分支的所有历史，以本次推送为准
          git push tangtv custom:refs/heads/main --force
          echo "[ok] 已强制覆盖 tangtv 仓库的 main 分支 (custom -> main)"

          # 方式二（彻底但危险）：完全镜像替换整个仓库，包括删除 tangtv 仓库多余的分支和 tag
          # 取消下面这行注释即可启用，启用后会删除 tangtv 仓库中所有不在源仓库的分支和 tag
          # git push tangtv --mirror
          # echo "[ok] 已完全镜像替换 tangtv 仓库（所有分支和tag）"

          echo ""
          echo "=== tangtv 仓库 main 分支最新提交 ==="
          git log tangtv/main -1 --oneline

      # ====== 第 15 步：构建 Debug APK（可选）======
      - name: 设置 JDK 17
        if: (steps.check_update.outputs.has_update == 'true' || github.event.inputs.force_rebuild == 'true') && github.event.inputs.build_apk == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 构建 Debug APK
        if: (steps.check_update.outputs.has_update == 'true' || github.event.inputs.force_rebuild == 'true') && github.event.inputs.build_apk == 'true'
        run: |
          echo "=== 开始构建 Debug APK ==="
          git checkout custom
          chmod +x gradlew 2>/dev/null || true
          # 接受 Android SDK licenses
          yes | sdkmanager --licenses 2>/dev/null || true
          # 构建 Debug APK
          ./gradlew assembleDebug --stacktrace 2>&1 | tail -50
          echo "=== 构建完成 ==="
          # 查找生成的 APK
          find app/build/outputs/apk -name "*.apk" 2>/dev/null || echo "未找到APK文件"

      - name: 上传 APK 到 Artifacts
        if: (steps.check_update.outputs.has_update == 'true' || github.event.inputs.force_rebuild == 'true') && github.event.inputs.build_apk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tangtv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      # ====== 第 16 步：结果汇总 ======
      - name: 同步结果汇总
        run: |
          echo "========================================"
          echo "  工作流执行完成！"
          echo "========================================"
          echo ""
          echo "main 分支（纯上游代码）:"
          git log refs/heads/main -1 --oneline
          echo ""
          if git show-ref --verify --quiet refs/heads/custom; then
            echo "custom 分支（上游 + 自定义修改）:"
            git log refs/heads/custom -1 --oneline
          else
            echo "custom 分支: 本次未更新（上游无变化且未强制重建）"
          fi
          echo ""
          echo "当前仓库: https://github.com/alantang1977/webhtv"
          echo "打 APK 请使用 custom 分支的代码"
          if [ "${{ github.event.inputs.push_to_tangtv }}" = "true" ]; then
            echo "已推送到: https://github.com/alantang1977/tangtv"
          fi
          if [ "${{ github.event.inputs.build_apk }}" = "true" ]; then
            echo "APK 已上传到本次运行的 Artifacts"
          fi
          echo "========================================"
